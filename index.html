<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chandni Chowk Cheese Café | Good Vibes, Great Food, Great Times</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
          },
          colors: {
            cccRed: '#EF4444',
            cccGreen: '#22C55E',
            cccBlue: '#3B82F6',
            cccYellow: '#EAB308',
            cccGold: '#c5a880',
            darkBg: '#0b0908',
            cardBg: '#14100e',
          },
          animation: {
            'spin-slow': 'spin 22s linear infinite',
            'float-slow': 'floatSlow 8s ease-in-out infinite',
            'pulse-glow': 'pulseGlow 5s ease-in-out infinite',
          },
          keyframes: {
            floatSlow: {
              '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
              '50%': { transform: 'translate(20px, -25px) scale(1.08)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.45', transform: 'scale(1)' },
              '50%': { opacity: '0.75', transform: 'scale(1.06)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0b0908;
      color: #ffffff;
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      /* Rich multi-color blend of the 4 logo colors: Red, Blue, Green, Yellow */
      background-image: 
        radial-gradient(at 5% 5%, rgba(239, 68, 68, 0.35) 0px, transparent 48%),
        radial-gradient(at 95% 8%, rgba(59, 130, 246, 0.35) 0px, transparent 48%),
        radial-gradient(at 8% 92%, rgba(34, 197, 94, 0.32) 0px, transparent 48%),
        radial-gradient(at 92% 90%, rgba(234, 179, 8, 0.36) 0px, transparent 48%),
        radial-gradient(at 50% 50%, rgba(239, 68, 68, 0.15) 0px, transparent 65%);
      background-attachment: fixed;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .tilt-card {
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
      transform-style: preserve-3d;
    }
    .tilt-card:hover {
      transform: translateY(-8px) scale(1.02);
    }
    .aurora-blur {
      filter: blur(120px);
      mix-blend-mode: screen;
    }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- Ambient 4-Color Floating Light Orbs -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
    <div class="absolute -top-[12%] -left-[10%] w-[680px] h-[680px] rounded-full bg-red-600/30 aurora-blur animate-pulse-glow" style="animation-duration: 7s;"></div>
    <div class="absolute top-[2%] -right-[10%] w-[720px] h-[720px] rounded-full bg-blue-600/32 aurora-blur animate-pulse-glow" style="animation-duration: 9s; animation-delay: 2s;"></div>
    <div class="absolute -bottom-[10%] left-[2%] w-[640px] h-[640px] rounded-full bg-emerald-500/28 aurora-blur animate-pulse-glow" style="animation-duration: 8s; animation-delay: 1s;"></div>
    <div class="absolute bottom-[5%] right-[5%] w-[650px] h-[650px] rounded-full bg-amber-400/32 aurora-blur animate-pulse-glow" style="animation-duration: 6s; animation-delay: 3s;"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[900px] h-[900px] rounded-full opacity-25 blur-[160px] animate-spin-slow pointer-events-none"
         style="background: conic-gradient(from 0deg, #EF4444 0deg, #EAB308 90deg, #22C55E 180deg, #3B82F6 270deg, #EF4444 360deg);">
    </div>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // Authentic 4-Circle CCC Logo Component
    const CCCLogo = ({ className = "w-10 h-10", animated = false }) => (
      <img
        src="/public/images/logo-ccc.png"
        alt="Chandni Chowk Cheese Café Official 4-Circle Logo"
        className={`${className} object-contain shrink-0 ${
          animated
            ? "hover:scale-110 transition-transform duration-300 drop-shadow-[0_0_22px_rgba(234,179,8,0.55)] cursor-pointer"
            : "drop-shadow-[0_0_12px_rgba(255,255,255,0.25)]"
        }`}
      />
    );

    // Apple iOS Emoji Component
    const IOSEmoji = ({ name, className = "w-4 h-4 inline-block align-middle", alt = "" }) => (
      <img
        src={`/public/images/emojis/${name}.png`}
        alt={alt || name}
        className={`${className} object-contain inline-block align-text-bottom select-none`}
        loading="lazy"
        draggable="false"
      />
    );

    // Navigation and Action Icons
    const ChevronLeft = ({ className = "w-5 h-5 text-white" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    );

    const ChevronRight = ({ className = "w-5 h-5 text-white" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    );

    const ArrowRight = ({ className = "w-3.5 h-3.5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
      </svg>
    );

    const MapPinIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
        <path strokeLinecap="round" strokeLinejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    );

    const PhoneIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
      </svg>
    );

    const InstagramIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
      </svg>
    );

    const UtensilsIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
      </svg>
    );

    const CheckIcon = ({ className = "w-4 h-4 text-green-400" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    );

    // 3D Coverflow Carousel Component
    function CoverFlowCarousel({
      items,
      sectionLabel = "CHANDNI CHOWK CHEESE CAFÉ",
      autoplay = true,
      autoplayDelay = 4500,
      className = "",
      onCtaClick,
    }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isHovered, setIsHovered] = useState(false);
      const touchStartX = useRef(0);
      const total = items ? items.length : 0;

      const nextSlide = useCallback(() => {
        if (total === 0) return;
        setCurrentIndex((prev) => (prev + 1) % total);
      }, [total]);

      const prevSlide = useCallback(() => {
        if (total === 0) return;
        setCurrentIndex((prev) => (prev - 1 + total) % total);
      }, [total]);

      const goToSlide = (idx) => {
        if (total === 0) return;
        setCurrentIndex(idx % total);
      };

      useEffect(() => {
        if (!autoplay || isHovered || total <= 1) return;
        const interval = setInterval(nextSlide, autoplayDelay);
        return () => clearInterval(interval);
      }, [autoplay, autoplayDelay, isHovered, nextSlide, total]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "ArrowLeft") prevSlide();
          if (e.key === "ArrowRight") nextSlide();
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [nextSlide, prevSlide]);

      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
      };

      const handleTouchEnd = (e) => {
        const diff = e.changedTouches[0].clientX - touchStartX.current;
        if (Math.abs(diff) > 45) {
          if (diff < 0) nextSlide();
          else prevSlide();
        }
      };

      if (!items || items.length === 0) return null;

      return (
        <section
          className={`relative w-full min-h-[760px] flex items-center justify-center overflow-hidden py-12 select-none ${className}`}
          style={{ backgroundColor: "transparent" }}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
          onTouchStart={handleTouchStart}
          onTouchEnd={handleTouchEnd}
        >
          {/* Background Ambience Glow */}
          <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
            <img
              src={items[currentIndex]?.img}
              alt="ambience background"
              style={{
                width: "100%",
                height: "100%",
                objectFit: "cover",
                filter: "brightness(0.18) blur(38px)",
                transform: "scale(1.2)",
                transition: "opacity 1000ms ease, filter 1000ms ease",
              }}
            />
            <div
              className="absolute inset-0"
              style={{
                background: "radial-gradient(circle at center, rgba(12,10,9,0.3) 0%, rgba(11,9,8,0.92) 100%)",
              }}
            />
          </div>

          <div className="relative w-full max-w-6xl mx-auto px-4 z-10 flex flex-col items-center">
            {/* Eyebrow with 4 logo color dots */}
            {sectionLabel && (
              <div className="flex items-center gap-3 mb-8">
                <span className="w-8 h-[2px] bg-gradient-to-r from-transparent to-red-500" />
                <span className="w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_10px_#22c55e]" />
                <h3 className="text-xs font-black tracking-[0.3em] uppercase text-amber-400 m-0">
                  {sectionLabel}
                </h3>
                <span className="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-[0_0_10px_#3b82f6]" />
                <span className="w-8 h-[2px] bg-gradient-to-l from-transparent to-amber-500" />
              </div>
            )}

            {/* 3D Coverflow Stage */}
            <div
              className="relative w-full h-[520px] flex justify-center items-center mb-8"
              style={{ perspective: "1400px" }}
            >
              {items.map((item, idx) => {
                const offset = (idx - currentIndex + total) % total;

                let transform = "translateX(0px) scale(0.4) rotateY(0deg)";
                let opacity = 0;
                let zIndex = 0;
                let filter = "brightness(0.4) blur(2px)";
                let isCenter = false;

                if (offset === 0) {
                  isCenter = true;
                  transform = "translateX(0px) scale(1) rotateY(0deg)";
                  opacity = 1;
                  zIndex = 30;
                  filter = "brightness(1)";
                } else if (offset === 1) {
                  transform = "translateX(285px) scale(0.84) rotateY(-24deg)";
                  opacity = 0.65;
                  zIndex = 20;
                  filter = "brightness(0.75)";
                } else if (offset === 2) {
                  transform = "translateX(510px) scale(0.68) rotateY(-38deg)";
                  opacity = 0.38;
                  zIndex = 10;
                  filter = "brightness(0.55) blur(1px)";
                } else if (offset === total - 1) {
                  transform = "translateX(-285px) scale(0.84) rotateY(24deg)";
                  opacity = 0.65;
                  zIndex = 20;
                  filter = "brightness(0.75)";
                } else if (offset === total - 2) {
                  transform = "translateX(-510px) scale(0.68) rotateY(38deg)";
                  opacity = 0.38;
                  zIndex = 10;
                  filter = "brightness(0.55) blur(1px)";
                }

                return (
                  <div
                    key={idx}
                    onClick={() => !isCenter && goToSlide(idx)}
                    style={{
                      position: "absolute",
                      width: "330px",
                      height: "500px",
                      borderRadius: "20px",
                      overflow: "hidden",
                      backgroundColor: "#161210",
                      border: isCenter ? "2px solid rgba(234, 179, 8, 0.55)" : "1px solid rgba(255, 255, 255, 0.14)",
                      transform,
                      opacity,
                      zIndex,
                      filter,
                      transformOrigin: "center center",
                      transition: "all 800ms cubic-bezier(0.25, 1, 0.5, 1)",
                      boxShadow: isCenter
                        ? "0 25px 60px rgba(0,0,0,0.95), 0 0 45px rgba(234, 179, 8, 0.3)"
                        : "0 15px 35px rgba(0,0,0,0.6)",
                      cursor: isCenter ? "default" : "pointer",
                    }}
                  >
                    {/* Dish Image */}
                    <img
                      src={item.img}
                      alt={item.titleLine1}
                      style={{
                        position: "absolute",
                        inset: 0,
                        width: "100%",
                        height: "100%",
                        objectFit: "cover",
                      }}
                    />

                    {/* Dark Vignette Overlay */}
                    <div
                      style={{
                        position: "absolute",
                        inset: 0,
                        background:
                          "linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.15) 25%, rgba(0,0,0,0.72) 60%, rgba(11,9,8,0.98) 100%)",
                        pointerEvents: "none",
                        zIndex: 10,
                      }}
                    />

                    {/* Content Overlay */}
                    <div
                      style={{
                        position: "relative",
                        width: "100%",
                        height: "100%",
                        padding: "20px 18px 22px",
                        display: "flex",
                        flexDirection: "column",
                        justifyContent: "space-between",
                        textAlign: "center",
                        zIndex: 20,
                        opacity: isCenter ? 1 : 0,
                        transform: isCenter ? "translateY(0px)" : "translateY(16px)",
                        transition: "opacity 500ms ease, transform 500ms ease",
                        pointerEvents: isCenter ? "auto" : "none",
                      }}
                    >
                      {/* Tag with Neon Badge */}
                      <div className="text-right w-full pr-1">
                        <span className="inline-block text-[11px] font-bold tracking-wider text-amber-300 bg-black/60 px-2.5 py-0.5 rounded-full border border-amber-400/30 shadow-[0_2px_8px_rgba(0,0,0,0.8)]">
                          {item.tag}
                        </span>
                      </div>

                      {/* Body Content */}
                      <div className="flex flex-col items-center gap-1 mt-auto pb-1">
                        <h2 className="text-2xl font-black uppercase tracking-tight text-white m-0 leading-tight drop-shadow-[0_3px_10px_rgba(0,0,0,0.95)]">
                          {item.titleLine1}
                        </h2>

                        {item.titleLine2 && (
                          <span className="text-sm font-bold uppercase tracking-wider text-amber-200/90 leading-tight drop-shadow-[0_2px_8px_rgba(0,0,0,0.9)]">
                            {item.titleLine2}
                          </span>
                        )}

                        <div className="w-10 h-0.5 bg-gradient-to-r from-red-500 via-amber-400 to-green-500 rounded-full my-1.5 shadow-[0_0_8px_rgba(234,179,8,0.7)]" />

                        {item.desc && (
                          <p className="text-xs italic text-stone-200 max-w-[280px] m-0 mb-3 leading-relaxed drop-shadow-[0_2px_6px_rgba(0,0,0,0.9)]">
                            {item.desc}
                          </p>
                        )}

                        <a
                          href={item.ctaUrl || "#"}
                          onClick={(e) => {
                            if (onCtaClick) {
                              e.preventDefault();
                              onCtaClick(item);
                            }
                          }}
                          className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-gradient-to-r from-amber-400 to-amber-500 text-stone-950 text-xs font-black tracking-widest uppercase no-underline shadow-[0_4px_16px_rgba(234,179,8,0.35)] hover:scale-105 transition-transform"
                        >
                          <span>{item.ctaText || "View Menu"}</span>
                          <ArrowRight className="w-3.5 h-3.5" />
                        </a>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Navigation Arrows */}
            <button
              onClick={prevSlide}
              aria-label="Previous dish"
              className="absolute left-6 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-black/60 border border-white/20 text-white flex items-center justify-center backdrop-blur-md cursor-pointer shadow-[0_8px_24px_rgba(0,0,0,0.5)] z-40 hover:bg-amber-500 hover:text-black hover:border-amber-400 transition-all"
            >
              <ChevronLeft className="w-5 h-5" />
            </button>

            <button
              onClick={nextSlide}
              aria-label="Next dish"
              className="absolute right-6 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-black/60 border border-white/20 text-white flex items-center justify-center backdrop-blur-md cursor-pointer shadow-[0_8px_24px_rgba(0,0,0,0.5)] z-40 hover:bg-amber-500 hover:text-black hover:border-amber-400 transition-all"
            >
              <ChevronRight className="w-5 h-5" />
            </button>

            {/* Pagination Dots */}
            <div className="flex items-center justify-center gap-2 z-30">
              {items.map((_, idx) => (
                <button
                  key={idx}
                  onClick={() => goToSlide(idx)}
                  aria-label={`Go to slide ${idx + 1}`}
                  className={`h-2 rounded-full border-none cursor-pointer transition-all duration-300 ${
                    idx === currentIndex
                      ? "w-8 bg-amber-400 shadow-[0_0_12px_rgba(234,179,8,0.8)]"
                      : "w-2 bg-white/25 hover:bg-white/50"
                  }`}
                />
              ))}
            </div>
          </div>
        </section>
      );
    }

    // Main App Component
    function App() {
      const [menuData, setMenuData] = useState(null);
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [activeTab, setActiveTab] = useState("menu");
      const [selectedPoster, setSelectedPoster] = useState(null);
      const [openFaq, setOpenFaq] = useState(0);
      const [bookingModal, setBookingModal] = useState({ open: false, service: "Birthday Celebrations" });

      useEffect(() => {
        fetch("/data/menu-data.json")
          .then((res) => res.json())
          .then((data) => setMenuData(data))
          .catch((err) => console.error("Error loading menu data:", err));
      }, []);

      if (!menuData) {
        return (
          <div className="w-full min-h-screen bg-[#0b0908] flex flex-col items-center justify-center text-amber-400">
            <CCCLogo className="w-24 h-24 animate-spin-slow mb-4" />
            <p className="tracking-widest uppercase text-xs font-bold">Opening Chandni Chowk Cheese Café...</p>
          </div>
        );
      }

      const { cafeInfo, carouselDishes, categories, cateringServices, reviews, faqs } = menuData;
      const allCategoryNames = ["All", ...categories.map((c) => c.categoryName)];
      const filteredCategories =
        selectedCategory === "All"
          ? categories
          : categories.filter((c) => c.categoryName === selectedCategory);

      return (
        <div className="w-full min-h-screen text-white relative">
          {/* Top Announcement Bar with iOS Sparkles */}
          <div className="w-full bg-[#161210]/95 backdrop-blur-md border-b border-white/10 text-center py-2 px-4 text-xs font-medium tracking-wide text-amber-300 flex items-center justify-center gap-2 sticky top-0 z-50">
            <IOSEmoji name="sparkles" className="w-4 h-4" />
            <span className="font-semibold">{cafeInfo.slogan}</span>
            <span className="hidden md:inline text-white/30">•</span>
            <span className="hidden md:inline text-stone-300 italic">Yamunanagar&apos;s 100% Vegetarian Food &amp; Vibes Hub</span>
            <IOSEmoji name="sparkles" className="w-4 h-4" />
          </div>

          {/* Sticky Navigation Bar with 4-color top accent */}
          <nav className="w-full bg-[#0b0908]/90 backdrop-blur-xl border-b border-white/10 sticky top-[37px] z-40 transition-all">
            <div className="h-[2px] w-full bg-gradient-to-r from-red-500 via-amber-400 via-green-500 to-blue-500" />
            
            <div className="max-w-6xl mx-auto px-4 py-2.5 flex items-center justify-between gap-4">
              {/* Brand Logo & Name */}
              <div 
                className="flex items-center gap-3 cursor-pointer group"
                onClick={() => { setActiveTab("menu"); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
              >
                <CCCLogo className="w-10 h-10 sm:w-11 sm:h-11 group-hover:scale-105 transition-transform" />
                <div className="text-left">
                  <div className="text-xs uppercase font-extrabold tracking-widest text-amber-400 flex items-center gap-1.5">
                    Chandni Chowk <span className="text-red-500 bg-red-500/10 px-1 rounded text-[10px] border border-red-500/30">चीज़</span>
                  </div>
                  <div className="text-lg font-black tracking-tighter text-white leading-none">
                    CHEESE CAFÉ
                  </div>
                </div>
              </div>

              {/* Navigation Tabs with Apple iOS Emojis */}
              <div className="hidden lg:flex items-center gap-1 bg-white/5 p-1 rounded-full border border-white/10 text-xs font-semibold backdrop-blur-md">
                <button
                  onClick={() => setActiveTab("menu")}
                  className={`px-4 py-2 rounded-full transition-all flex items-center gap-2 ${
                    activeTab === "menu" ? "bg-amber-400 text-black shadow-md shadow-amber-400/20 font-bold" : "text-stone-300 hover:text-white"
                  }`}
                >
